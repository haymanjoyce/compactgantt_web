<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompactGantt</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
  <script src="dates.js"></script>
  <script src="parser.js"></script>
  <script src="renderer.js"></script>
  <script src="writer.js"></script>
  <script src="ui.js"></script>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #status { margin: 0.5rem 0 0.75rem; color: #555; }
    .tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .tab { padding: 5px 18px; cursor: pointer; border: 1px solid #bbb; background: #f0f0f0; font-size: 0.9rem; }
    .tab.active { background: white; border-bottom-color: white; font-weight: bold; }
    #chartPanel { overflow-x: auto; }
    h2 { margin-bottom: 0.4rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; font-size: 0.85rem; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; white-space: nowrap; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>

  <input type="file" id="fileInput" accept=".xlsx">
  <button id="saveBtn" disabled>Save</button>
  <p id="status">No file loaded</p>

  <div class="tabs">
    <button class="tab active" id="tabData">Data</button>
    <button class="tab"        id="tabChart">Chart</button>
  </div>

  <div id="dataPanel">
    <h2>Tasks</h2>               <div id="tasksContainer"></div>
    <h2>Swimlanes</h2>           <div id="swimlanesContainer"></div>
    <h2>Links</h2>               <div id="linksContainer"></div>
    <h2>Pipes</h2>               <div id="pipesContainer"></div>
    <h2>Curtains</h2>            <div id="curtainsContainer"></div>
    <h2>Notes</h2>               <div id="notesContainer"></div>
    <h2>Config: Layout</h2>      <div id="configLayoutContainer"></div>
    <h2>Config: Bars</h2>        <div id="configBarsContainer"></div>
    <h2>Config: Timeline</h2>    <div id="configTimelineContainer"></div>
    <h2>Config: Titles</h2>      <div id="configTitlesContainer"></div>
    <h2>Config: Style</h2>       <div id="configStyleContainer"></div>
    <h2>Config: Typography</h2>  <div id="configTypographyContainer"></div>
    <h2>Config: Preferences</h2> <div id="configPreferencesContainer"></div>
    <h2>Config: Rendering</h2>  <div id="configRenderingContainer"></div>
  </div>

  <div id="chartPanel" style="display:none;">
    <p id="chartMessage">No project loaded</p>
  </div>

  <script>initUI();</script>

</body>
</html>
