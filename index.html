<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompactGantt</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
  <script src="dates.js"></script>
  <script src="parser.js"></script>
  <script src="renderer.js"></script>
  <script src="writer.js"></script>
  <script src="validation.js"></script>
  <script src="ui.js"></script>
  <style>
    :root {
      --cg-border: 1px solid #ccc;
      --cg-bg-panel: white;
      --cg-bg-toolbar: #f5f5f5;
      --cg-bg-selected: #e0ecff;
      --cg-data-form-col-width: 420px;
      --cg-data-label-col-width: 140px;
      --cg-data-panel-max-width: 1400px;
      --cg-config-form-col-width: 420px;
      --cg-config-label-col-width: 200px;
      --cg-control-height: 28px;
      --cg-toolbar-height: 41px; /* control-height + 2*6px padding + 1px border */
      --cg-gap: 8px;
    }
    /* Viewport-height flex shell: chrome rows (toolbar, status, tab strip) are
       fixed-height flex items; the active tab panel (.app-panel) fills the rest
       and scrolls internally. margin:0 kills the UA 8px so 100vh isn't exceeded;
       border-box keeps padding inside the 100vh; overflow:hidden so only the
       panel scrolls, never the body. */
    body {
      font-family: sans-serif; padding: 1rem;
      margin: 0; box-sizing: border-box;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    /* Chrome rows never shrink — a wrapped toolbar grows its own height and the
       panel area absorbs the difference (no hard-coded chrome-height guess). */
    .app-toolbar, #status, .tabs { flex: none; }
    /* The active tab panel fills the remaining viewport. min-height:0 lets it
       shrink below content height so it scrolls rather than overflowing. */
    .app-panel { flex: 1 1 auto; min-height: 0; }
    /* Plain panels scroll their own content. */
    #chartPanel, #issuesPanel, #inspectorPanel { overflow: auto; }
    /* Strip-bearing panels are nested flex columns: fixed strip + filling area. */
    #dataPanel, #configPanel { display: flex; flex-direction: column; overflow: hidden; }
    #entityArea, #configArea { flex: 1 1 auto; min-height: 0; }
    /* Top action toolbar — square geometry to match the tab strip below */
    .app-toolbar { display: flex; align-items: center; gap: 4px; margin-bottom: 0.5rem; }
    .app-toolbar button {
      padding: 4px 12px; font-size: 0.9rem;
      border: 1px solid #bbb; background: #f0f0f0; cursor: pointer;
      height: var(--cg-control-height); box-sizing: border-box;
    }
    .app-toolbar button:hover { background: #e4e4e4; border-color: #999; }
    .app-toolbar button:disabled {
      color: #999; background: #fafafa; border-color: #ddd; cursor: default;
    }
    .app-toolbar button:disabled:hover { background: #fafafa; border-color: #ddd; }
    .app-toolbar-divider { width: 1px; height: 20px; background: #ddd; }
    #status {
      display: flex; align-items: center;
      margin: 0 0 0.75rem; padding: 6px 10px; color: #555;
      border: var(--cg-border); background: var(--cg-bg-toolbar);
    }
    .status-text { flex: 1; }
    .status-chip {
      margin-left: auto; padding: 1px 8px; font-size: 12px;
      border: 1px solid #ddd;
    }
    .status-chip-present { border-color: #9fc4a0; background: #eaf3e8; color: #3b6d11; }
    .status-chip-absent  { border-color: #ddd;     background: #f0f0f0; color: #999; }
    .tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .tab { padding: 5px 18px; cursor: pointer; border: 1px solid #bbb; background: #f0f0f0; font-size: 0.9rem; }
    .tab.active { background: white; border-bottom-color: white; font-weight: bold; }
    .tab-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-left: 6px; vertical-align: middle;
    }
    .tab-dot-error   { background: #b91c1c; }
    .tab-dot-warning { background: #b45309; }
    .tab-dot-notice  { background: #4b5563; }
    .chart-scroll { overflow-x: auto; }
    .chart-controls {
      display: flex; align-items: center; gap: 16px;
      padding: 6px 8px; margin-bottom: 8px;
      background: var(--cg-bg-toolbar); border: var(--cg-border);
      font-size: 0.85rem;
    }
    h2 { margin-bottom: 0.4rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; font-size: 0.85rem; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; white-space: nowrap; }
    th { background: #f0f0f0; }

    /* Data panel — second-tier tab strip */
    .entity-tabs { display: flex; gap: 2px; margin-bottom: 8px; border-bottom: var(--cg-border); flex: none; }
    .entity-tab {
      padding: 4px 14px; cursor: pointer; background: transparent;
      border: none; font-size: 0.85rem; color: #555;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .entity-tab:hover { color: #222; }
    .entity-tab.active { color: #222; font-weight: 600; border-bottom-color: #2563eb; }

    /* Data panel — two-pane layout */
    .entity-panel {
      display: grid;
      grid-template-columns: 1fr var(--cg-data-form-col-width);
      grid-template-rows: minmax(0, 1fr);
      gap: var(--cg-gap);
      align-items: stretch;
      max-width: var(--cg-data-panel-max-width);
      height: 100%; min-height: 0;
    }
    .entity-left, .entity-right {
      border: var(--cg-border); background: var(--cg-bg-panel);
      min-height: 0; overflow: auto;
    }
    .entity-right { padding: 12px; }

    /* Toolbar */
    .entity-toolbar {
      display: flex; gap: 4px; padding: 6px;
      background: var(--cg-bg-toolbar);
      border-bottom: var(--cg-border);
      position: sticky; top: 0; z-index: 2;
      min-height: var(--cg-toolbar-height);
      box-sizing: border-box;
    }
    .entity-toolbar button {
      padding: 3px 10px; font-size: 0.85rem;
      border: 1px solid #bbb; background: white; cursor: pointer;
      height: var(--cg-control-height); box-sizing: border-box;
    }
    .entity-toolbar button:disabled { color: #999; cursor: not-allowed; background: #fafafa; }

    /* Navigation table */
    .entity-nav-table { width: 100%; margin: 0; font-size: 0.85rem; }
    /* -1px is a deliberate overlap under the toolbar (z-index 2) to eliminate sub-pixel-rounding gaps during scroll. */
    .entity-nav-table th { position: sticky; top: calc(var(--cg-toolbar-height) - 1px); z-index: 1; }
    /* Sticky th drops its collapsed border on scroll, so paint the header's bottom
       rule as an inset box-shadow (1px #ccc) — survives sticking and matches the grid. */
    .entity-nav-table th { box-shadow: inset 0 -1px 0 #ccc; }
    .entity-nav-table tbody tr { cursor: pointer; }
    .entity-nav-table tbody tr.selected { background: var(--cg-bg-selected); }
    /* Chart-row boundary (Tasks only): a heavy dark line above the first task of
       each new chart-row group within a swimlane. The ambient cell grid is a thin
       1px #ccc; this is 2px #ccc, so under border-collapse the heavier border wins
       at the boundary and reads as a distinct chart-row separator rather than just
       another grid line. Still subordinate to the bold, filled swimlane group-header
       band (swimlane > chart-row > ordinary row). Composes over the selected-row background. */
    .entity-nav-table tbody tr.chart-row-start td { border-top: 2px solid #ccc; }
    /* Display-only cells (no data-field) read muted vs near-black editable cells —
       a gentle cue, not a disabled look. tr[data-id] excludes group-header and
       empty-state rows. The id cell greys but stays readable (it's not editable). */
    .entity-nav-table tbody tr[data-id] td:not([data-field]) { color: #666; }
    /* Editable cells (data-field): subtle hover tint, light enough to compose over
       the selected-row background. */
    .entity-nav-table tbody tr[data-id] td[data-field]:hover { background: rgba(0, 0, 0, 0.04); }
    /* Inline cell editor (double-click a name cell). Fills the cell and inherits
       the table font; margin:-1px 0 absorbs the 1px border so the row height
       doesn't jump versus the plain text cell. */
    .entity-nav-table td .nav-cell-input {
      width: 100%; box-sizing: border-box; font: inherit;
      margin: -1px 0; padding: 0 2px; border: 1px solid #888;
    }
    /* Swimlane group headers in the Tasks nav table: plain bold, not selectable
       (no data-id), and a <td> rather than <th> so the sticky-th rule never applies. */
    .entity-nav-table-group-header td { font-weight: bold; cursor: default; background: var(--cg-bg-toolbar); }
    /* CSS-drawn task symbols in the Tasks nav table symbol column.
       border-box keeps the 1px black border inside the declared dimensions, so the
       border never grows the bounding box (diamond stays centred, bar width stays = inline px). */
    .task-symbol { display: inline-block; vertical-align: middle; box-sizing: border-box; border: 1px solid black; }
    /* Bar width is set inline per row (proportional to duration); only height is fixed here. */
    .task-symbol-bar { height: 12px; }
    /* 9px square → ~12.7px diagonal, matching the bar's 12px vertical extent once rotated. */
    .task-symbol-milestone { width: 9px; height: 9px; transform: rotate(45deg); }
    /* Fixed symbol-column width — must match SYMBOL_COL_WIDTH_PX in ui.js (bar maxWidth basis). */
    .entity-nav-table .task-symbol-col { width: 64px; }
    /* id column: right-align in every entity nav table; exclude the two colspan rows
       (Tasks group headers, and the centered .entity-empty message — which the
       first-child selector would otherwise out-specify). width: 1px shrinks id to
       its content width so slack flows to the other column(s); visible only on the
       two-column Notes table (id otherwise absorbs ~half the width). */
    .entity-nav-table th:first-child,
    .entity-nav-table tbody tr:not(.entity-nav-table-group-header) td:first-child:not(.entity-empty) {
      text-align: right; width: 1px;
    }
    /* rowCount column (Swimlanes only) — numeric, right-aligned. */
    .entity-nav-table .swimlane-rowcount-col { text-align: right; }
    /* line-glyph column (Links only) — fixed narrow width, centered SVG preview.
       The glyph's stroke colors are independent, so it composes over the
       selected-row background. */
    .entity-nav-table .link-glyph-col { width: 48px; text-align: center; white-space: nowrap; }
    .entity-nav-table .link-glyph { vertical-align: middle; }
    /* from/to FK columns (Links only): equal proportional width — both claim 50%
       so the browser splits the space left by the fixed id / line columns evenly
       between them, keeping the two endpoint cells the same width. */
    .entity-nav-table .link-fk-col { width: 50%; }
    .entity-empty {
      padding: 1.5rem; text-align: center; color: #777; font-size: 0.9rem;
    }

    /* Edit form */
    .entity-form { display: grid; grid-template-columns: var(--cg-data-label-col-width) 1fr; gap: var(--cg-gap); align-items: center; }
    .config-panel .entity-form { grid-template-columns: var(--cg-config-label-col-width) 1fr; }
    .entity-form label { text-align: right; font-size: 0.85rem; color: #444; }
    .entity-form input, .entity-form select {
      height: var(--cg-control-height); padding: 2px 6px; font-size: 0.85rem;
      box-sizing: border-box; width: 100%;
    }
    .entity-form textarea {
      padding: 4px 6px; font-size: 0.85rem; font-family: inherit;
      box-sizing: border-box; width: 100%; resize: none;
    }
    .entity-form .readonly {
      height: var(--cg-control-height); padding: 4px 6px; font-size: 0.85rem;
      background: #f5f5f5; border: 1px solid #ddd; color: #555; box-sizing: border-box;
      display: flex; align-items: center;
    }
    .entity-form .checkbox-wrapper {
      height: var(--cg-control-height);
      display: flex; align-items: center;
    }
    .entity-form .checkbox-wrapper input[type="checkbox"] {
      width: auto; height: auto; margin: 0;
    }

    /* Entity/Config form section heading — full-width (both grid columns), small
       bold heading with a top hairline rule and spacing to separate it from the
       preceding group. The first heading in a form drops the rule/gap so the
       form doesn't open with an empty band. Shared by Config sub-tab forms and
       Data-tab entity edit forms. */
    .entity-form .form-section-heading {
      grid-column: 1 / -1;
      font-size: 0.8rem; font-weight: 700; color: #333;
      margin-top: 10px; padding-top: 8px;
      border-top: var(--cg-border);
    }
    .entity-form .form-section-heading:first-child {
      margin-top: 0; padding-top: 0; border-top: none;
    }

    /* Live font preview — display-only specimen swatch spanning both grid columns,
       shown below the Font Family select. The bordered, padded frame is neutral
       chrome (form's normal UI font); the sample pangram inside has its font-family
       set imperatively to the live config.typography.fontFamily so the user sees the
       real applied typeface (and the browser's fallback) before committing. The
       .is-empty modifier covers the empty/null state: muted placeholder text in the
       form's normal font (no sample font applied, so it can't read as a working choice). */
    .entity-form .font-preview {
      grid-column: 1 / -1;
      font-size: 1.1rem; color: #222;
      padding: 10px 12px;
      border: var(--cg-border); border-radius: 4px;
      background: #fafafa;
    }
    .entity-form .font-preview.is-empty {
      font-size: 0.85rem; color: #999; font-style: italic;
    }

    /* Color picker — text input (source of truth) + native swatch side-by-side
       in the right grid column, with an optional ✕ clear button (allowEmpty
       call sites only). Text input flex-grows; swatch and clear button each
       occupy a fixed 24px slot. */
    .entity-form .color-row-wrapper {
      display: flex; align-items: center; gap: 4px; width: 100%;
    }
    .entity-form .color-row-wrapper > input[type="text"] {
      flex: 1 1 0; min-width: 0; width: auto;
    }
    .entity-form .color-row-wrapper > input[type="color"].color-swatch {
      flex: 0 0 24px;
      width: 24px; height: 24px;
      padding: 0; border: 1px solid #bbb; cursor: pointer;
      background: transparent;
    }
    /* Empty-state cue for clearable (allowEmpty) color swatches only — gated on
       .is-unset, applied by ui.js when the field is null/''. A native color
       well always paints a filled colour (#000000 when blank), which reads as a
       deliberate black; this overrides the well with a muted fill + thin
       diagonal slash (the universal "unset" cue), distinct from any real colour.
       !important is required to beat the well's underlying RGB. Set/required
       swatches never carry .is-unset, so their wells are untouched. */
    .entity-form .color-row-wrapper > input[type="color"].color-swatch.is-unset::-webkit-color-swatch {
      background-color: #fafafa !important;
      background-image: linear-gradient(to top right,
        transparent 0 calc(50% - 0.5px),
        #999 calc(50% - 0.5px) calc(50% + 0.5px),
        transparent calc(50% + 0.5px) 100%) !important;
    }
    .entity-form .color-row-wrapper > input[type="color"].color-swatch.is-unset::-moz-color-swatch {
      background-color: #fafafa !important;
      background-image: linear-gradient(to top right,
        transparent 0 calc(50% - 0.5px),
        #999 calc(50% - 0.5px) calc(50% + 0.5px),
        transparent calc(50% + 0.5px) 100%) !important;
    }
    .entity-form .color-row-wrapper > .color-clear-btn {
      flex: 0 0 24px;
      width: 24px; height: 24px;
      padding: 0; margin: 0;
      border: 1px solid #bbb; background: #fafafa; color: #555;
      font-size: 0.85rem; line-height: 1;
      cursor: pointer;
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
    }
    .entity-form .color-row-wrapper > .color-clear-btn:hover {
      background: #eee; color: #222;
    }
    .entity-form .color-row-wrapper > .color-clear-btn:disabled {
      cursor: default; opacity: 0.5;
    }

    /* Config panel — form-only, single column, no two-pane grid */
    .config-panel {
      border: var(--cg-border); background: var(--cg-bg-panel);
      padding: 12px;
      max-width: calc(var(--cg-config-label-col-width) + var(--cg-config-form-col-width) + var(--cg-gap) * 2 + 24px);
      height: 100%; min-height: 0; overflow: auto;
    }
    .entity-form-empty {
      padding: 2rem 1rem; text-align: center; color: #777; font-size: 0.9rem;
    }
    .entity-stub {
      padding: 2rem; text-align: center; color: #777; font-size: 0.9rem;
      border: var(--cg-border); background: var(--cg-bg-panel);
    }

    .issues-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 0.5rem; }
    .issues-search { flex: 1 1 240px; min-width: 180px; padding: 4px 8px; font-size: 0.9rem; border: 1px solid #bbb; }
    .issues-check { font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .issues-summary { font-size: 0.85rem; color: #555; margin-bottom: 0.75rem; display: flex; flex-direction: column; gap: 2px; }
    .issues-empty { padding: 1rem 1.25rem; border: 1px solid #ddd; background: #fafafa; color: #555; font-size: 0.9rem; text-align: center; margin-bottom: 1rem; }
    .issues-clear { padding: 1.25rem; border: 1px solid #a7f3d0; background: #ecfdf5; color: #047857; text-align: center; }
    .issues-clear-main { font-weight: 600; font-size: 0.95rem; }
    .issues-band { margin-bottom: 1.25rem; }
    .issues-band-header { padding: 6px 10px; font-weight: 600; font-size: 0.9rem; }
    .issues-band-errors   .issues-band-header { background: #fee2e2; color: #991b1b; }
    .issues-band-warnings .issues-band-header { background: #fef3c7; color: #92400e; }
    .issues-band-notices  .issues-band-header { background: #f3f4f6; color: #374151; }
    .issues-subheader { padding: 4px 10px; font-size: 0.85rem; color: #444; font-weight: 600; background: #fafafa; border-top: 1px solid #eee; }
    .issues-table { width: 100%; margin-bottom: 0.5rem; }
    .issues-table th { cursor: pointer; user-select: none; }
    .issues-table td { vertical-align: top; }
    .issues-table .issues-col-message,
    .issues-table .issues-col-value { white-space: normal; word-break: break-word; }
    .issues-table .issues-col-id      { text-align: right; }
    .issues-pill { display: inline-block; padding: 1px 8px; font-size: 0.78rem; font-weight: 600; border-radius: 10px; }
    .issues-pill-errors   { background: #fecaca; color: #991b1b; }
    .issues-pill-warnings { background: #fde68a; color: #92400e; }
    .issues-pill-notices  { background: #e5e7eb; color: #374151; }
    .issues-placeholder { color: #9ca3af; }

    /* Inspector tables — static read-only diagnostic view; content-width, not full-width. */
    #inspectorPanel table { border-collapse: collapse; font-size: 0.85rem; margin-bottom: 0.5rem; }
    #inspectorPanel th, #inspectorPanel td { border: none; padding: 4px 8px; border-bottom: 1px solid #eee; }
    #inspectorPanel th {
      text-align: left; background: var(--cg-bg-toolbar); border-bottom: 2px solid #ccc;
    }
    #inspectorPanel tbody tr:nth-child(even) { background: #fafafa; }
    /* Section headers: moderate, bold, tight rhythm, delineating rule. */
    #inspectorPanel h2 {
      font-size: 1rem; font-weight: bold; margin: 1.25rem 0 0.35rem;
      padding-bottom: 0.2rem; border-bottom: var(--cg-border);
    }
    #inspectorPanel .inspector-section-source { color: #999; font-weight: normal; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="app-toolbar">
    <button id="newProjectBtn">New Project</button>
    <button id="chooseFileBtn">Choose file</button>
    <input type="file" id="fileInput" accept=".xlsx" style="display: none;">
    <button id="saveBtn" disabled>Save</button>
    <button id="saveSvgBtn" disabled>Save SVG</button>
    <span class="app-toolbar-divider"></span>
    <button id="loadBaselineBtn" disabled title="Load a project first">Load Baseline</button>
    <button id="clearBaselineBtn" disabled title="No baseline loaded">Clear Baseline</button>
    <input type="file" id="baselineInput" accept=".xlsx" style="display: none;">
  </div>
  <p id="status">No file loaded</p>

  <div class="tabs">
    <button class="tab"        id="tabChart">Chart</button>
    <button class="tab active" id="tabData">Data</button>
    <button class="tab"        id="tabConfig">Config</button>
    <button class="tab"        id="tabIssues">Issues</button>
    <button class="tab"        id="tabInspector">Inspector</button>
  </div>

  <div id="dataPanel" class="app-panel"></div>

  <div id="chartPanel" class="app-panel" style="display:none;">
    <p>No project loaded</p>
  </div>

  <div id="issuesPanel" class="app-panel" style="display:none;"></div>

  <div id="configPanel" class="app-panel" style="display:none;"></div>

  <div id="inspectorPanel" class="app-panel" style="display:none;"></div>

  <script>initUI();</script>

</body>
</html>
